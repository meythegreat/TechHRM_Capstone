# TechHRM n8n on Render, using Render Postgres for workflow data.
# https://render.com/docs/deploy-n8n
#
# The web service stays on the free plan. The database is the smallest paid
# plan because a workspace can have only one free Postgres database, and
# TechHRM already uses that one. Do not delete the existing free database.
#
# A free web service sleeps after 15 minutes, so the first reset after idle
# can take a while. Upgrade techhrm-n8n to 1c-2g or larger when you want it
# to stay awake.
#
# After the first deploy:
# 1. Open the techhrm-n8n URL and create the n8n owner account.
# 2. Add an SMTP credential: host smtp.gmail.com, port 465, SSL/TLS on.
#    User is MAIL_CONTACT_ADDRESS. Password is that Gmail account's app password.
#    Save the app password only in n8n.
# 3. Import n8n/forgot-password.workflow.json, select that credential on
#    Send Gmail SMTP, and activate the workflow.
# 4. On the Laravel API service set:
#    N8N_FORGOT_PASSWORD_WEBHOOK=https://<techhrm-n8n host>/webhook/techhrm/forgot-password

services:
  - type: web
    plan: free
    runtime: image
    name: techhrm-n8n
    image:
      url: docker.io/n8nio/n8n:latest
    healthCheckPath: /healthz
    envVars:
      # Encrypts credentials stored in n8n. Do not change this after the first deploy.
      - key: N8N_ENCRYPTION_KEY
        generateValue: true

      # Render has no IPv6 route. Without this, Gmail SMTP fails with
      # ENETUNREACH to an address like 2607:f8b0:400e:c17::6c:465.
      - key: NODE_OPTIONS
        value: "--dns-result-order=ipv4first"

      # n8n listens on 5678. Render routes public HTTPS to this port.
      - key: PORT
        value: "5678"
      - key: N8N_PORT
        value: "5678"
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_PROXY_HOPS
        value: "1"
      - key: N8N_HOST
        fromService:
          name: techhrm-n8n
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: WEBHOOK_URL
        fromService:
          name: techhrm-n8n
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: N8N_EDITOR_BASE_URL
        fromService:
          name: techhrm-n8n
          type: web
          envVarKey: RENDER_EXTERNAL_URL

      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: techhrm-n8n-db
          property: database
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: techhrm-n8n-db
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: techhrm-n8n-db
          property: port
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: techhrm-n8n-db
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: techhrm-n8n-db
          property: password

databases:
  - name: techhrm-n8n-db
    plan: 0.1c-256mb
    databaseName: n8n
